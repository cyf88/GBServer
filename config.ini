# GBServer 国标转码平台配置
# 说明：key=value 形式，支持 [section] 分节与 # 注释。
# 本文件由网页配置页生成，修改后需重启 GBServer 生效。

[sip]
# 本机国标 ID（SIP 用户 ID），上级看到的平台 ID
id = 34020000002000000002
# SIP 域（通常为 ID 前 10 位）
domain = 3402000000
# 本机 SIP 监听 IP，留空则自动探测
ip = 
# SIP 监听端口（UDP 与 TCP 同时监听）
port = 5060
# 向上级发起请求时优先使用的传输协议：udp / tcp
transport = udp
# HTTP 管理接口端口
http_port = 8081

[transfer]
# 转码服务 TransferServer 的 HTTP 控制地址
http_url = http://127.0.0.1:8080
# 是否开启转码
transcode = true
# 转码输出格式：h264 / h265
transcode_format = h264
# 拉流协议（下级 -> 转码服务）：tcp / udp
src_protocol = tcp
# 是否解密（SVAC 流）
decrypt = false
# 解密密钥（16 字节的 base64）
vkek = 
# 转码帧率与码率
fps = 25
bitrate = 2000000

[upper]
# 是否主动对接上级平台
enable = false
# 本机在上级平台的注册 ID（留空则使用 sip.id）
id = 34020000002000000001
# 上级平台域（留空则使用 sip.domain）
domain = 3402000000
# 上级平台 SIP 地址与端口
ip = 
port = 5060
# 向上级发送请求的传输协议：udp / tcp
transport = udp
# 注册密码
password = 
# 注册有效期（秒）
expires = 3600
# 心跳间隔（秒）
keepalive_interval = 60
# 目录上报间隔（秒），0 表示不上报
catalog_interval = 300

[lower]
# 下级平台注册密码，留空表示不鉴权
default_password = 
